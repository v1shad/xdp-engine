<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XDP Intrusion Engine Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1, h2 { color: #bb86fc; }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-value {
            font-size: 3em;
            font-weight: bold;
            color: #03dac6;
        }
        .card-title {
            font-size: 1.2em;
            color: #aaaaaa;
            text-transform: uppercase;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 1.2em;
        }
        th { background: #2c2c2c; color: #bb86fc; }
        .severity-high { color: #cf6679; font-weight: bold; }
        .action-block { color: #cf6679; font-weight: bold; }
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .feed-item {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 5px solid transparent;
        }
        .feed-item.new-item {
            animation: flash 1s ease-out;
        }
        @keyframes flash {
            0% { background-color: #333333; }
            100% { background-color: #1e1e1e; }
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            color: #000;
            text-transform: uppercase;
        }
        .badge-low { background-color: #2196F3; }
        .badge-medium { background-color: #FFC107; }
        .badge-high { background-color: #FF9800; }
        .badge-critical { background-color: #F44336; color: #fff; }
        
        .icon-event { color: #aaaaaa; }
        .icon-alert { color: #FF9800; }
        .icon-action { color: #03dac6; }
        
        .side-panel {
            position: fixed;
            top: 0; right: -400px; width: 360px; height: 100%;
            background: #1e1e1e;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
            z-index: 1000;
        }
        .side-panel.open { right: 0; }
        .close-btn {
            background: none; border: none; color: #fff; font-size: 1.5em;
            cursor: pointer; position: absolute; top: 10px; right: 15px;
        }
        .detail-group { margin-bottom: 20px; }
        .detail-title { color: #aaaaaa; font-size: 0.9em; text-transform: uppercase; margin-bottom: 5px;}
        .detail-value { font-size: 1.1em; }
    </style>
</head>
<body>
    <div id="side-panel" class="side-panel">
        <button class="close-btn" onclick="document.getElementById('side-panel').classList.remove('open')">&times;</button>
        <h2 id="sp-rule">Incident Detail</h2>
        
        <div class="detail-group">
            <div class="detail-title">Severity</div>
            <div class="detail-value"><span id="sp-sev" class="badge"></span></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">Source IP</div>
            <div class="detail-value" id="sp-ip"></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">MITRE Techniques</div>
            <div class="detail-value" id="sp-mitre"></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">Labels & Offense</div>
            <div class="detail-value" id="sp-labels"></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">Block Duration</div>
            <div class="detail-value" id="sp-block"></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">Actions Taken</div>
            <div class="detail-value" id="sp-actions"></div>
        </div>
        <div class="detail-group">
            <div class="detail-title">Related Events (Last 5m)</div>
            <div class="detail-value" id="sp-events"></div>
        </div>
    </div>

    <h1>Intrusion Engine Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <div class="card-value" id="val-events">0</div>
            <div class="card-title">Total Events</div>
        </div>
        <div class="card">
            <div class="card-value" id="val-alerts">0</div>
            <div class="card-title">Total Alerts</div>
        </div>
        <div class="card">
            <div class="card-value" id="val-blocks">0</div>
            <div class="card-title">Active Blocks</div>
        </div>
        <div class="card">
            <div class="card-value" id="val-drops">0</div>
            <div class="card-title">Total Packets Dropped</div>
        </div>
    </div>

    <div class="charts">
        <div class="chart-container">
            <h2>Top Attackers</h2>
            <canvas id="attackersChart"></canvas>
        </div>
        <div class="chart-container">
            <h2>Drops per Second (Last 5 min)</h2>
            <canvas id="dropsChart"></canvas>
        </div>
    </div>

    <h2>Live Feed</h2>
    <div id="live-feed" class="feed-container"></div>

    <script src="/static/chart.js"></script>
    <script>
        // Setup Chart.js defaults for dark theme
        Chart.defaults.color = '#aaaaaa';
        Chart.defaults.font.size = 14;
        
        const mitreLookup = {
            "T1110": "Brute Force",
            "T1046": "Network Service Discovery",
            "T1190": "Exploit Public-Facing Application"
        };
        
        async function showIncidentDetail(id) {
            try {
                let res = await fetch('/api/alert/' + id);
                if (!res.ok) return;
                let data = await res.json();
                
                document.getElementById('sp-rule').textContent = data.alert.rule;
                
                let sevEl = document.getElementById('sp-sev');
                sevEl.textContent = data.alert.severity;
                sevEl.className = 'badge badge-' + data.alert.severity;
                
                document.getElementById('sp-ip').textContent = data.alert.src_ip;
                
                let mitres = (data.alert.mitre || '').split(',').filter(x => x);
                let mitreEl = document.getElementById('sp-mitre');
                mitreEl.innerHTML = ''; // clearing old nodes
                mitres.forEach(m => {
                    let d = document.createElement('div');
                    d.textContent = m + (mitreLookup[m] ? ' - ' + mitreLookup[m] : '');
                    mitreEl.appendChild(d);
                });
                
                let offStr = data.alert.offense_count ? ` (Offense #${data.alert.offense_count})` : '';
                document.getElementById('sp-labels').textContent = (data.alert.label || 'none') + offStr;
                document.getElementById('sp-block').textContent = data.alert.block_seconds ? `${data.alert.block_seconds}s` : 'None';
                
                let actionsEl = document.getElementById('sp-actions');
                actionsEl.innerHTML = '';
                data.actions.forEach(a => {
                    let d = document.createElement('div');
                    d.textContent = `[${a.ts.substring(11,19)}] ${a.action} - ${a.reason}`;
                    actionsEl.appendChild(d);
                });
                
                let evEl = document.getElementById('sp-events');
                evEl.innerHTML = '';
                data.events.forEach(e => {
                    let d = document.createElement('div');
                    d.textContent = `[${e.ts.substring(11,19)}] ${e.type}`;
                    evEl.appendChild(d);
                });
                
                document.getElementById('side-panel').classList.add('open');
            } catch(e) { console.error(e); }
        }

        let attackersChart = new Chart(document.getElementById('attackersChart'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Events', data: [], backgroundColor: '#cf6679' }] },
            options: { responsive: true }
        });

        let dropsChart = new Chart(document.getElementById('dropsChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Drops/sec', data: [], borderColor: '#03dac6', tension: 0.1 }] },
            options: { responsive: true, scales: { x: { display: false }, y: { beginAtZero: true } } }
        });

        async function updateDashboard() {
            try {
                // Update Summary
                let res = await fetch('/api/summary');
                let summary = await res.json();
                document.getElementById('val-events').textContent = summary.total_events;
                document.getElementById('val-alerts').textContent = summary.total_alerts;
                document.getElementById('val-blocks').textContent = summary.active_blocks;
                document.getElementById('val-drops').textContent = summary.total_drops;

                // Update Top Attackers
                res = await fetch('/api/top_attackers');
                let attackers = await res.json();
                attackersChart.data.labels = attackers.map(a => a.src_ip);
                attackersChart.data.datasets[0].data = attackers.map(a => a.count);
                attackersChart.update();

                // Update Drops/sec
                res = await fetch('/api/drops_per_sec');
                let drops = await res.json();
                dropsChart.data.labels = drops.map(d => new Date(d.ts * 1000).toLocaleTimeString());
                dropsChart.data.datasets[0].data = drops.map(d => d.pps);
                dropsChart.update();

                // Update Live Feed
                res = await fetch('/api/feed');
                let feed = await res.json();
                let container = document.getElementById('live-feed');
                let existingItems = new Set(Array.from(container.children).map(el => el.dataset.uid));
                
                container.innerHTML = ''; // Clear out old list, we will rebuild
                feed.forEach(item => {
                    let uid = item.row_type + '-' + item.id;
                    let isNew = !existingItems.has(uid) && existingItems.size > 0;
                    
                    let div = document.createElement('div');
                    div.className = 'feed-item';
                    if (isNew) div.classList.add('new-item');
                    div.dataset.uid = uid;
                    
                    if (item.row_type === 'alert') {
                        div.style.borderLeftColor = '#cf6679';
                        div.style.cursor = 'pointer';
                        div.onclick = () => showIncidentDetail(item.id);
                    } else if (item.row_type === 'action') {
                        div.style.borderLeftColor = '#03dac6';
                    }
                    
                    let timeEl = document.createElement('span');
                    timeEl.textContent = item.ts.substring(11, 19); // just time
                    div.appendChild(timeEl);
                    
                    let iconEl = document.createElement('span');
                    iconEl.className = 'icon-' + item.row_type;
                    if (item.row_type === 'event') iconEl.textContent = '⚡';
                    else if (item.row_type === 'alert') iconEl.textContent = '🚨';
                    else if (item.row_type === 'action') iconEl.textContent = '🛡️';
                    div.appendChild(iconEl);
                    
                    let titleEl = document.createElement('strong');
                    titleEl.textContent = item.title;
                    div.appendChild(titleEl);
                    
                    let ipEl = document.createElement('span');
                    ipEl.textContent = item.src_ip;
                    div.appendChild(ipEl);
                    
                    let sevEl = document.createElement('span');
                    sevEl.className = 'badge badge-' + (item.severity || 'low');
                    sevEl.textContent = item.severity;
                    div.appendChild(sevEl);
                    
                    if (item.detail) {
                        let detailEl = document.createElement('span');
                        detailEl.textContent = item.detail;
                        detailEl.style.color = '#888';
                        div.appendChild(detailEl);
                    }
                    
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Dashboard update failed", err);
            }
        }

        // Auto-refresh every 2 seconds
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
